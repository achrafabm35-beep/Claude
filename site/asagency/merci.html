<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci — AS Marketing Agency</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="img/logo-mark-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thanks { position: relative; display: grid; place-items: center; min-height: 100svh; padding: 28px; text-align: center; overflow: hidden; }
    .thanks::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(900px, 130vw); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, rgba(31, 198, 182, 0.22), rgba(143, 176, 240, 0.1) 55%, transparent); transform: translate(-50%, -50%); animation: halo 7s ease-in-out infinite alternate; }
    @keyframes halo { to { transform: translate(-50%, -50%) scale(1.16); } }
    .thanks__in { position: relative; max-width: 620px; }
    .thanks__in > * { animation: up 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .thanks__in > :nth-child(2) { animation-delay: 0.1s; } .thanks__in > :nth-child(3) { animation-delay: 0.2s; } .thanks__in > :nth-child(4) { animation-delay: 0.3s; }
    @keyframes up { from { opacity: 0; transform: translateY(26px); } }
    .thanks img { height: 64px; width: auto; margin: 0 auto 30px; }
    .thanks h1 { font: 600 clamp(2.6rem, 8vw, 5rem)/0.98 var(--sans); letter-spacing: -0.04em; }
    .thanks h1 em { display: block; font: italic 400 1.06em/1 var(--serif); letter-spacing: -0.01em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.12em; }
    .thanks p { margin: 22px auto 34px; max-width: 38ch; color: var(--mute); font-size: 1.1rem; }
    @media (prefers-reduced-motion: reduce) { .thanks::before, .thanks__in > * { animation: none; } }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks__in">
      <img src="img/logo-mark-light.webp" alt="AS Marketing Agency" />
      <h1>Bien reçu. <em>On s’y met.</em></h1>
      <p>Nous revenons vers vous sous 24 h, puis vous recevez une première version à découvrir.</p>
      <a href="index.html" class="btn btn--light btn--lg">Retour au site</a>
    </div>
  </main>
</body>
</html>
